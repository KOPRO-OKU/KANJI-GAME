<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* Layout: one-screen game on manuscript-paper (genkō yōshi) grid; kanji falls toward a vermilion line */
:root{
  --paper:#eef2f1; --ink:#1d2321; --muted:#5d6a66; --grid:#cfdcd8; --panel:#ffffff;
  --ai:#2c4f7c; --ai-soft:#dfe8f3; --shu:#cf432c; --ok:#2f7d4f;
  --f-brush:"Yuji Syuku","Hiragino Mincho ProN","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121816; --ink:#e7ece9; --muted:#93a39e; --grid:#232f2b; --panel:#1a2320;
  --ai:#8fb0dc; --ai-soft:#22324a; --shu:#ff7a5c; --ok:#6fcf97; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --ink:#e7ece9; --muted:#93a39e; --grid:#232f2b; --panel:#1a2320;
  --ai:#8fb0dc; --ai-soft:#22324a; --shu:#ff7a5c; --ok:#6fcf97; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
/* iPhone/Android 共通：画面（キーボード表示中は見えている範囲）にぴったり固定する */
#app{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#app.kb{padding-bottom:0}
html,body{overscroll-behavior:none}
button,input{touch-action:manipulation}
section{flex:1;min-height:0;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--ai);outline-offset:2px}

/* ---- menu ---- */
#menu{overflow-y:auto;padding-block:20px 24px;gap:22px}
.brand{display:flex;align-items:flex-end;gap:14px}
.brand .seal{font-family:var(--f-brush);font-size:44px;line-height:1;color:var(--paper);background:var(--shu);border-radius:8px;padding:8px 10px 10px;transform:rotate(-4deg)}
.brand h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.04em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
h2{margin:0 0 10px;font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--grid);background:var(--panel);border-radius:12px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.opt b{font-size:17px}
.opt span{font-size:12px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv.wide{grid-column:1/-1}
.lv.wide .ex{color:var(--shu)}
.ver{font-size:14px;color:var(--shu);font-weight:700;letter-spacing:.06em;vertical-align:middle}
.lv{position:relative}
.lv .ex{font-family:var(--f-brush);font-size:22px;color:var(--ai);line-height:1.2}
.lv .best{position:absolute;top:10px;right:12px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#start{margin-top:auto;border:0;background:var(--shu);color:#fff;font-size:20px;font-weight:900;letter-spacing:.2em;padding:16px;border-radius:14px}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
#dictState[data-ok]{color:var(--ok)}

/* ---- game ---- */
#game{padding-block:10px 12px;gap:10px}
.hud{display:flex;align-items:center;gap:10px;font-size:13px}
.hud .tag{background:var(--ai-soft);color:var(--ai);border-radius:999px;padding:4px 10px;font-weight:700}
.hud .score{margin-left:auto;font-variant-numeric:tabular-nums;font-size:15px}
.hud .score b{font-size:22px}
.hud .btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--grid);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.hud .btn svg{width:14px;height:14px;fill:currentColor}
#pauseOv{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;
  background:var(--panel);background:color-mix(in srgb,var(--panel) 88%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#pauseOv h3{margin:0;font-size:22px;font-weight:900;letter-spacing:.1em}
#pauseOv p{margin:0;font-size:13px;color:var(--muted)}
#pauseOv .row{width:100%;max-width:320px;flex-direction:column}
#field.paused #word{visibility:hidden}
#field{position:relative;flex:1;min-height:120px;border-radius:14px;overflow:hidden;background-color:var(--panel);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;background-position:center top;border:1px solid var(--grid)}
#ground{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--shu)}
#ground::before{content:"ここまでに答えよう";position:absolute;right:8px;bottom:10px;font-size:11px;color:var(--shu);font-weight:700}
#word{position:absolute;left:50%;top:0;transform:translate(-50%,0);font-family:var(--f-brush);color:var(--ink);
  white-space:nowrap;line-height:1.1;padding:6px 14px;border-radius:10px;background:var(--panel);border:2px solid var(--ink);will-change:top}
#word.danger{border-color:var(--shu);color:var(--shu)}
#word.hit{animation:hit .35s ease-out forwards}
@keyframes hit{to{transform:translate(-50%,-30px) scale(1.25);opacity:0;border-color:var(--ok);color:var(--ok)}}
#pop{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-weight:900;font-size:22px;color:var(--ok);pointer-events:none;opacity:0}
#pop.show{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-40px)}}
.panel{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:10px}
#typeBox{display:flex;gap:8px}
#answer{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 12px;border-radius:10px;border:2px solid var(--grid);background:var(--paper);color:var(--ink)}
#answer.shake{animation:shake .3s;border-color:var(--shu)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
#send{border:0;background:var(--ai);color:var(--panel);font-weight:700;border-radius:10px;padding:0 16px;font-size:16px}
#voiceBox{display:flex;align-items:center;gap:12px}
.mic{width:48px;height:48px;flex:none;border:0;padding:0;border-radius:50%;background:var(--shu);display:grid;place-items:center}
.mic.idle{background:var(--muted)}
.mic svg{width:22px;height:22px;fill:#fff}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--shu) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
#heard{font-size:18px;min-height:1.4em;overflow-wrap:anywhere}
#heard small{display:block;font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}

/* ---- game over ---- */
#over{justify-content:center;gap:18px;padding-block:24px;text-align:center}
#over h2{font-size:14px;color:var(--shu);letter-spacing:.3em}
.missed{font-family:var(--f-brush);font-size:64px;line-height:1.1}
.reading{font-size:22px;font-weight:700;color:var(--ai)}
.result{font-size:15px;color:var(--muted)}
.result b{font-size:40px;color:var(--ink);font-variant-numeric:tabular-nums}
#newBest{color:var(--shu);font-weight:900}
.row{display:flex;gap:10px}
.row button{flex:1;padding:14px;border-radius:12px;font-size:16px;font-weight:700;border:2px solid var(--grid);background:var(--panel)}
.row .primary{background:var(--shu);border-color:var(--shu);color:#fff}
#log{font-size:13px;color:var(--muted);line-height:1.8;max-height:22vh;overflow-y:auto}
@media (prefers-reduced-motion: reduce){#word.hit,#pop.show,.mic.live,#answer.shake{animation:none}}

/* 画面の高さをキーボード表示に合わせる */
function fit(){
  const vv=window.visualViewport,app=$("app");
  const h=vv?vv.height:innerHeight, top=vv?vv.offsetTop:0;
  app.style.height=h+"px";
  app.style.transform=top?`translateY(${top}px)`:"";      // iPhoneでキーボードが出て画面が押し上げられた分を戻す
  app.classList.toggle("kb",innerHeight-h>120);             // キーボード表示中は下の余白を詰める
  if(!vv||!top)window.scrollTo(0,0);
}
if(window.visualViewport){visualViewport.addEventListener("resize",fit);visualViewport.addEventListener("scroll",fit)}
window.addEventListener("resize",fit);window.addEventListener("orientationchange",()=>setTimeout(fit,300));fit();

function show(id){["menu","game","over"].forEach(s=>$(s).hidden=s!==id)}

/* ===== メニュー ===== */
const pref=store.get("kyo2-pref");if(pref){try{const p=JSON.parse(pref);S.mode=p.mode||S.mode;S.level=p.level??S.level}catch(e){}}
function renderMenu(){
  document.querySelectorAll("#modes .opt").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
  $("voiceNote").hidden=S.mode!=="voice";
  $("levels").innerHTML="";
  LEVELS.forEach((L,i)=>{
    const b=document.createElement("button");b.className="opt lv"+(L.wide?" wide":"");b.setAttribute("aria-pressed",i===S.level);
    const best=store.get(bestKey(i,S.mode));
    b.innerHTML=`<b></b><span class="ex"></span>${best?`<span class="best">ベスト ${best}</span>`:""}`;
    b.querySelector("b").textContent=L.name;b.querySelector(".ex").textContent=L.ex;
    b.onclick=()=>{S.level=i;savePref();renderMenu()};
    $("levels").appendChild(b);
  });
}
function savePref(){store.set("kyo2-pref",JSON.stringify({mode:S.mode,level:S.level}))}

loadDict();

/* ===== 文字の正規化 ===== */
const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>kata2hira((s||"").normalize("NFKC")).replace(/[\s。、．，,.!?！？「」・]/g,"");

/* ===== 漢字→ひらがな変換（kuromoji 形態素解析） ===== */
let TK=null;
function loadDict(){
  // 単体HTML版は KYO_DICT で辞書の置き場所（CDN）を指定する
  const cfg=window.KYO_DICT||{src:"kuromoji.js",path:"dict/",suffix:".wasm"};
  const st=$("dictState");
  const fail=()=>{st.textContent="ひらがな変換の辞書を読み込めませんでした（通信環境を確認してください）"};
  const build=()=>{try{window.KUROMOJI_SUFFIX=cfg.suffix;kuromoji.builder({dicPath:cfg.path}).build((err,t)=>{
    if(err){fail();return}
    TK=t;st.textContent="ひらがな変換：準備OK";st.dataset.ok="1"})}catch(e){fail()}};
  if(window.kuromoji){build();return}
  const sc=document.createElement("script");sc.src=cfg.src;sc.onload=build;sc.onerror=fail;
  document.head.appendChild(sc);
}
function toHira(text){
  let t=(text||"").normalize("NFKC");
  // いま落ちている漢字がそのまま出てきたら、まず正しい読みに置き換える（特殊な読み対策）
  if(S.cur&&t.includes(S.cur.k))t=t.split(S.cur.k).join(S.cur.r[0]);
  if(TK&&HAS_KANJI_ANY.test(t)){
    t=TK.tokenize(t).map(x=>x.reading&&x.reading!=="*"?x.reading:x.surface_form).join("");
  }
  return kata2hira(t);
}
const HAS_KANJI_ANY=/[\u3400-\u9fff\uf900-\ufaff々〆ヶ]/;

/* ===== 効果音 ===== */
let ac=null;
function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=ok?880:180;o.type=ok?"triangle":"sawtooth";g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(ok?.25:.5));
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(ok?.25:.5))}catch(e){}}

/* ===== ゲーム進行 ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
  const L=LEVELS[S.level];
  S.score=0;S.log=[];S.queue=shuffle(L.list);S.running=true;S.paused=false;$("pauseOv").hidden=true;$("field").classList.remove("paused");
  $("score").textContent=0;$("hudLevel").textContent=L.name;
  show("game");beep(true);
  setInputMode(S.mode);
  next();
  S.last=performance.now();requestAnimationFrame(loop);
}
function next(){
  if(!S.queue.length)S.queue=shuffle(LEVELS[S.level].list);
  S.cur=S.queue.pop();S.prog=0;S.solved=false;
  // 正解するほど少しずつ速くなる（最速で基本の55%）
  S.dur=LEVELS[S.level].sec*Math.max(.55,Math.pow(.96,S.score));
  const w=$("word");w.className="";w.textContent=S.cur.k;
  const n=[...S.cur.k].length;w.style.fontSize=(n<=2?72:n<=3?60:n<=4?48:40)+"px";
  place();
  $("heard").innerHTML="<small>聞き取り中…</small>";
}
function place(){
  const f=$("field"),w=$("word");
  const max=f.clientHeight-w.offsetHeight-6;
  w.style.top=Math.max(0,S.prog*max)+"px";
  w.classList.toggle("danger",S.prog>.7);
}
function loop(t){
  if(!S.running)return;
  const dt=Math.min(.1,(t-S.last)/1000);S.last=t;
  if(!S.solved&&!S.paused){S.prog+=dt/S.dur;place();if(S.prog>=1){gameOver();return}}
  requestAnimationFrame(loop);
}
function correct(){
  if(S.solved||!S.running)return;
  S.solved=true;S.score++;S.log.push(S.cur);
  $("score").textContent=S.score;beep(true);
  $("word").classList.add("hit");
  const p=$("pop");p.textContent=`正解！ ${S.cur.r[0]}`;p.classList.remove("show");void p.offsetWidth;p.classList.add("show");
  setTimeout(()=>{if(S.running)next()},380);
}
function gameOver(){
  S.running=false;stopVoice();beep(false);
  $("answer").blur();
  $("missed").textContent=S.cur.k;$("missedReading").textContent=S.cur.r.join(" ／ ");
  $("final").textContent=S.score;
  const k=bestKey(S.level,S.mode),best=+(store.get(k)||0);
  $("newBest").hidden=!(S.score>best&&S.score>0);if(S.score>best)store.set(k,S.score);
  $("log").textContent=S.log.length?"読めた漢字："+S.log.map(w=>`${w.k}（${w.r[0]}）`).join("　"):"";
  show("over");
}
/* ===== 一時停止・ホーム ===== */
function pause(home){
  if(!S.running)return;
  if(!S.paused){S.paused=true;stopVoice();ans.value="";ans.blur();$("field").classList.add("paused")}
  $("pauseTitle").textContent=home?"ホームに戻りますか？":"一時停止中";
  $("pauseMsg").textContent=home?"今回の記録は保存されません":"漢字は再開するまで隠れています";
  $("pauseOv").hidden=false;
  $("resumeBtn").focus();
}
function resume(){
  if(!S.running||!S.paused)return;
  S.paused=false;$("pauseOv").hidden=true;$("field").classList.remove("paused");
  S.last=performance.now();
  setInputMode(S.inputMode||S.mode);
}
function goHome(){S.running=false;S.paused=false;stopVoice();$("pauseOv").hidden=true;show("menu");renderMenu()}
$("pauseBtn").onclick=()=>pause(false);
$("homeBtn").onclick=()=>pause(true);
$("resumeBtn").onclick=resume;
$("pauseHome").onclick=goHome;
$("start").onclick=start;$("retry").onclick=start;$("toMenu").onclick=goHome;
// アプリを切り替えたり画面を消したりしたら自動で一時停止
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause(false);else S.last=performance.now()});

/* ===== タッチ（ひらがな）入力 ===== */
const ans=$("answer");
function check(final){
  if(S.solved||S.paused||!S.running)return;
  const v=norm(ans.value);
  if(S.cur.r.includes(v)){correct();setTimeout(()=>{ans.value=""},0);return}
  if(final&&v){ans.classList.remove("shake");void ans.offsetWidth;ans.classList.add("shake");beep(false);ans.value=""}
}
const HAS_KANJI=/[\u3400-\u9fff\uf900-\ufaff々〆ヶ]/;
function hiraganaize(){ // キーボードのマイク等で漢字が入ったら、ひらがなに直す
  if(HAS_KANJI.test(ans.value)){ans.value=toHira(ans.value);return true}return false}
ans.addEventListener("input",e=>{if(!e.isComposing)hiraganaize();check(false)});
ans.addEventListener("compositionend",()=>{hiraganaize();check(false);if(S.solved)setTimeout(()=>{ans.value=""},0)});
$("typeBox").addEventListener("submit",e=>{e.preventDefault();hiraganaize();check(true);ans.focus()});

/* ===== 音声入力 ===== */
let rec=null,voiceOn=false,micTimer=0;
$("mic").onclick=()=>{if(!S.running||S.paused)return;stopVoice();startVoice()};
function setInputMode(m){
  S.inputMode=m;
  const voice=m==="voice"&&!!SR;
  $("typeBox").hidden=voice;$("voiceBox").hidden=!voice;
  if(voice){$("hint").textContent="はっきり読み上げてください";startVoice()}
  else{
    $("hint").textContent=m!=="type"?"この環境では音声認識が使えないため、タッチ入力に切り替えました（キーボードのマイクボタンで話しても、ひらがなに直して判定します）":"ひらがなで入力すると自動で判定します";
    ans.value="";setTimeout(()=>ans.focus(),50);
  }
}
function startVoice(){
  voiceOn=true;
  const me=new SR();rec=me;rec.lang="ja-JP";rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=5;
  rec.onstart=()=>{clearTimeout(micTimer);const m=$("mic");m.classList.add("live");m.classList.remove("idle");$("hint").textContent="はっきり読み上げてください"};
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      const said=toHira(r[0].transcript);
      $("heard").innerHTML="";const s=document.createElement("span");s.textContent=said;$("heard").append(s);
      for(let j=0;j<r.length;j++){if(voiceMatch(toHira(r[j].transcript))){correct();return}}
      if(r.isFinal&&!S.solved&&norm(said)){const sm=document.createElement("small");sm.textContent="ちがうみたい。もう一度！";$("heard").append(sm)}
    }
  };
  rec.onerror=e=>{
    if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){voiceOn=false;setInputMode("type-fallback")}
  };
  rec.onend=()=>{
    if(rec!==me)return;   // 作り直した古い認識は無視
    $("mic").classList.remove("live");
    if(voiceOn&&S.running&&!S.paused){
      try{rec.start()}catch(err){}
      // iPhoneなどで自動再開できなかったときは、マイクのタップで再開してもらう
      clearTimeout(micTimer);
      micTimer=setTimeout(()=>{if(voiceOn&&S.running&&!S.paused&&!$("mic").classList.contains("live")){$("mic").classList.add("idle");$("hint").textContent="マイクのボタンをタップすると聞き取りを再開します"}},1500);
    }
  };
  try{rec.start()}catch(err){voiceOn=false;setInputMode("type-fallback")}
}
function voiceMatch(t){
  if(!S.cur||S.solved||S.paused)return false;
  const n=norm(t);if(!n)return false;
  return S.cur.r.some(r=>r.length<=2?n===r:n.includes(r));          // 読み（短い読みは完全一致のみ）
}
function stopVoice(){voiceOn=false;clearTimeout(micTimer);if(rec){try{rec.abort()}catch(e){}rec=null}$("mic").classList.remove("live")}
</script>
</body></html>
